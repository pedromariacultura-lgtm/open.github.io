<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://open-admin.camila-9a7.workers.dev https://raw.githubusercontent.com; img-src 'self' data:; form-action 'self'; base-uri 'self'">
  <title>Admin — OPEN Design Independente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background: #E0E0E0; color: #454545; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
    .container { max-width: 720px; width: 100%; }
    h1 { font-size: 22px; font-weight: 800; font-style: italic; color: #000; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #8F8F8F; margin-bottom: 28px; }
    .card { background: #FFF; border: 1px solid #d4d4d4; border-radius: 2px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 14px; font-weight: 700; font-style: italic; margin-bottom: 16px; color: #000; }
    label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d4d4d4; border-radius: 2px; font-family: 'Montserrat', sans-serif; font-size: 13px; color: #454545; margin-bottom: 14px; transition: border-color 0.2s; }
    input:focus, textarea:focus { outline: none; border-color: #000; }
    textarea { resize: vertical; min-height: 60px; }
    .link-item { background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 2px; padding: 16px; margin-bottom: 12px; position: relative; }
    .link-item .link-fields { display: grid; gap: 10px; }
    .link-item .remove-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #C8C8C8; cursor: pointer; font-size: 18px; }
    .link-item .remove-btn:hover { color: #e00; }
    .featured-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .featured-toggle input[type="checkbox"] { width: auto; margin: 0; }
    .featured-toggle label { margin: 0; cursor: pointer; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 2px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; font-style: italic; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #000; color: #fff; }
    .btn-primary:hover { background: #333; }
    .btn-secondary { background: #e0e0e0; color: #454545; }
    .btn-secondary:hover { background: #ccc; }
    .btn-success { background: #C3D940; color: #000; }
    .btn-success:hover { background: #a8bf2f; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 12px 24px; border-radius: 2px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; }
    .toast.error { background: #c00; }
    .logged-user { font-size: 12px; color: #8F8F8F; margin-bottom: 20px; }
    .hint { font-size: 12px; color: #888; line-height: 1.6; }
    .session-info { font-size: 11px; color: #8F8F8F; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header" style="text-align: center; margin-bottom: 24px;">
      <img src="../logo.jpg" alt="OPEN Design Independente" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1);">
      <h1>Admin</h1>
      <p class="sub">Links OPEN Design Independente</p>
    </div>

    <div id="login-section" class="card">
      <h2>Acesso Restrito</h2>
      <label for="password-input">Senha de admin</label>
      <input type="password" id="password-input" placeholder="Digite a senha...">
      <button class="btn btn-primary" onclick="login()" id="login-btn">Entrar</button>
      <p class="hint" style="margin-top:12px;">Ap&oacute;s 10 tentativas erradas, o IP &eacute; bloqueado por 1 hora.</p>
    </div>

    <div id="admin-section" style="display:none;">
      <div class="logged-user">Sess&atilde;o ativa &mdash; altera&ccedil;&otilde;es viram commits no reposit&oacute;rio</div>
      <div class="card">
        <h2>Descri&ccedil;&atilde;o Principal</h2>
        <label for="tagline">Texto abaixo do t&iacute;tulo do site</label>
        <textarea id="tagline" maxlength="300"></textarea>
      </div>
      <div class="card">
        <h2>Links</h2>
        <div id="links-container"></div>
        <button class="btn btn-secondary" onclick="addLink()">+ Adicionar Link</button>
      </div>
      <div class="actions">
        <button class="btn btn-success" onclick="saveChanges()" id="save-btn">Salvar &amp; Publicar</button>
        <button class="btn btn-secondary" onclick="logout()">Sair</button>
      </div>
      <p id="save-status" style="font-size:11px;color:#8f8f8f;margin-top:8px;"></p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const WORKER_URL = 'https://open-admin.camila-9a7.workers.dev';
    const DATA_URL = 'https://raw.githubusercontent.com/pedromariacultura-lgtm/open.github.io/main/data.json';
    let sessionToken = sessionStorage.getItem('admin_session') || null;

    if (sessionToken) { showAdmin(); loadData(); }

    async function login() {
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Verificando...';
      const password = document.getElementById('password-input').value;
      if (!password) { showToast('Digite a senha', 'error'); btn.disabled = false; btn.textContent = 'Entrar'; return; }

      try {
        const r = await fetch(WORKER_URL + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(result.error || 'HTTP ' + r.status);
        }
        sessionToken = result.token;
        sessionStorage.setItem('admin_session', sessionToken);
        showAdmin();
        loadData();
        showToast('Login realizado!');
      } catch(e) {
        showToast('Erro: ' + e.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Entrar';
    }

    async function logout() {
      if (sessionToken) {
        try {
          await fetch(WORKER_URL + '/api/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + sessionToken }
          });
        } catch(e) {}
      }
      sessionToken = null;
      sessionStorage.removeItem('admin_session');
      document.getElementById('admin-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('password-input').value = '';
      showToast('Desconectado');
    }

    function showAdmin() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('admin-section').style.display = 'block';
    }

    async function loadData() {
      try {
        const r = await fetch(DATA_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        renderForm(data);
      } catch(e) {
        showToast('Erro ao carregar dados: ' + e.message, 'error');
      }
    }

    function renderForm(data) {
      document.getElementById('tagline').value = data.tagline || '';
      const c = document.getElementById('links-container'); c.innerHTML = '';
      (data.links || []).forEach((l, i) => c.appendChild(makeLink(l, i)));
    }

    function makeLink(link, idx) {
      const d = document.createElement('div'); d.className = 'link-item';
      d.innerHTML = '<button class="remove-btn" onclick="if(confirm(\'Remover?\'))this.closest(\'.link-item\').remove()">&times;</button>' +
        '<div class="link-fields">' +
        '<div><label>Nome</label><input type="text" class="link-label" value="' + esc(link.label) + '" placeholder="Ex: Instagram"></div>' +
        '<div><label>URL</label><input type="url" class="link-url" value="' + esc(link.url) + '" placeholder="https://..."></div>' +
        '<div><label>Descri\u00e7\u00e3o</label><input type="text" class="link-desc" value="' + esc(link.desc || '') + '" placeholder="Opcional"></div>' +
        '<div class="featured-toggle"><input type="checkbox" class="link-featured"' + (link.featured ? ' checked' : '') + ' id="feat-' + idx + '"><label for="feat-' + idx + '">Destacar com neon</label></div>' +
        '</div>';
      return d;
    }

    function esc(t) { if (!t) return ''; return String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function addLink() { document.getElementById('links-container').appendChild(makeLink({ label: '', url: '', platform: 'custom', desc: '', featured: false }, document.querySelectorAll('.link-item').length)); }

    function collect() {
      const tagline = document.getElementById('tagline').value.trim();
      const links = Array.from(document.querySelectorAll('.link-item')).map((item, i) => {
        const label = item.querySelector('.link-label').value.trim() || 'Link';
        let url = item.querySelector('.link-url').value.trim() || '#';
        const dangerous = /^\s*(javascript|data|vbscript):/i;
        if (dangerous.test(url)) {
          throw new Error('Link ' + (i + 1) + ': URLs com javascript:/data:/vbscript: não são permitidas');
        }
        if (url !== '#' && !/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        return { label, url, platform: detect(label), desc: item.querySelector('.link-desc').value.trim(), featured: item.querySelector('.link-featured').checked };
      });
      return { tagline, links };
    }

    function detect(l) { const s = l.toLowerCase(); if (s.includes('instagram')) return 'instagram'; if (s.includes('tiktok')) return 'tiktok'; if (s.includes('youtube') || s.includes('youtu')) return 'youtube'; if (s.includes('threads')) return 'threads'; if (s.includes('x /') || s.includes('twitter') || s === 'x') return 'x'; if (s.includes('site') || s.includes('oficial') || s.includes('website')) return 'website'; if (s.includes('edital') || s.includes('select') || s.includes('inscreva')) return 'edital'; return 'custom'; }

    async function saveChanges() {
      const btn = document.getElementById('save-btn'); btn.disabled = true; btn.textContent = 'Salvando...';
      document.getElementById('save-status').textContent = '';
      try {
        const data = collect();
        const r = await fetch(WORKER_URL + '/api/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + sessionToken
          },
          body: JSON.stringify({ data: data })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (r.status === 401) { logout(); throw new Error('Sessão expirada. Faça login novamente.'); }
          throw new Error(result.error || 'HTTP ' + r.status);
        }
        showToast('Publicado!');
        document.getElementById('save-status').textContent = 'Commit ' + result.commit + ' — site atualiza em segundos';
      } catch(e) {
        showToast('Erro: ' + e.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Salvar & Publicar';
    }

    function showToast(m, t) { const o = document.getElementById('toast'); o.textContent = m; o.className = 'toast' + (t ? ' ' + t : ''); o.classList.add('show'); setTimeout(() => o.classList.remove('show'), 4000); }
  </script>
</body>
</html>
