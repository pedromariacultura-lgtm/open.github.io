<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OPEN Design Independente</title>
  <meta name="description" content="Desenvolvendo e Incentivando o Design Independente do Sul do Brasil.">
  <meta property="og:title" content="OPEN Design Independente">
  <meta property="og:description" content="Desenvolvendo e Incentivando o Design Independente do Sul do Brasil.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar / Logo area */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #ff2e63, #8e2de2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 4px 30px rgba(255, 107, 53, 0.3);
      user-select: none;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 14px;
      color: #999;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
      max-width: 400px;
    }

    /* Link cards */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #f5f5f5;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
    }

    .link-card:hover {
      background: #222;
      border-color: #444;
      transform: translateY(-1px);
    }

    .link-card:active {
      transform: translateY(0);
      background: #252525;
    }

    .link-card .icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .link-card .label {
      flex: 1;
      text-align: center;
    }

    .link-card .arrow {
      font-size: 14px;
      color: #666;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(3px);
    }

    /* Instagram */
    .link-card.instagram:hover { border-color: #e1306c; }
    .link-card.instagram:hover .icon { color: #e1306c; }

    /* TikTok */
    .link-card.tiktok:hover { border-color: #00f2ea; }
    .link-card.tiktok:hover .icon { color: #00f2ea; }

    /* YouTube */
    .link-card.youtube:hover { border-color: #ff0000; }
    .link-card.youtube:hover .icon { color: #ff0000; }

    /* Threads */
    .link-card.threads:hover { border-color: #fff; }

    /* X / Twitter */
    .link-card.x:hover { border-color: #fff; }

    /* WhatsApp */
    .link-card.whatsapp:hover { border-color: #25d366; }
    .link-card.whatsapp:hover .icon { color: #25d366; }

    /* Website */
    .link-card.website:hover { border-color: #ff6b35; }
    .link-card.website:hover .icon { color: #ff6b35; }

    /* Form */
    .link-card.form:hover { border-color: #8e2de2; }
    .link-card.form:hover .icon { color: #8e2de2; }

    /* Footer */
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #444;
      text-align: center;
    }

    .footer a {
      color: #666;
      text-decoration: none;
    }

    .footer a:hover {
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">O</div>
    <h1>OPEN Design Independente</h1>
    <p class="tagline">Desenvolvendo e Incentivando o Design Independente do Sul do Brasil.</p>

    <div class="links">
      <a href="https://instagram.com/open_designindependente" target="_blank" rel="noopener noreferrer" class="link-card instagram">
        <span class="icon">&#9654;</span>
        <span class="label">Instagram</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://tiktok.com/@open_designindependente" target="_blank" rel="noopener noreferrer" class="link-card tiktok">
        <span class="icon">&#9835;</span>
        <span class="label">TikTok</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://www.youtube.com/@open_designindependente" target="_blank" rel="noopener noreferrer" class="link-card youtube">
        <span class="icon">&#9654;</span>
        <span class="label">YouTube</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://www.threads.com/@open_designindependente" target="_blank" rel="noopener noreferrer" class="link-card threads">
        <span class="icon">@</span>
        <span class="label">Threads</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://x.com/opendesignindep" target="_blank" rel="noopener noreferrer" class="link-card x">
        <span class="icon">X</span>
        <span class="label">X / Twitter</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://api.whatsapp.com/send?phone=5551993315453" target="_blank" rel="noopener noreferrer" class="link-card whatsapp">
        <span class="icon">&#9993;</span>
        <span class="label">WhatsApp</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://www.opendesignindependente.com.br/designers-selo-open" target="_blank" rel="noopener noreferrer" class="link-card website">
        <span class="icon">&#9670;</span>
        <span class="label">Site Oficial</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="https://forms.gle/rH6oTg8KGxFRfPjs7" target="_blank" rel="noopener noreferrer" class="link-card form">
        <span class="icon">&#9998;</span>
        <span class="label">Selo OPEN &mdash; Cadastro</span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>

    <div class="footer">
      <a href="https://pedromariacultura-lgtm.github.io/open.github.io" target="_blank">OPEN Design Independente</a>
    </div>
  </div>
</body>
</html>
