<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Links OPEN Design Independente</title>
  <meta name="description" content="Desenvolvendo e Incentivando o Design Independente do Sul do Brasil.">
  <meta property="og:title" content="Links OPEN Design Independente">
  <meta property="og:description" content="Desenvolvendo e Incentivando o Design Independente do Sul do Brasil.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background: #E0E0E0; color: #454545; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 50px 20px 60px; }
    .container { max-width: 680px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 18px; box-shadow: 0 4px 30px rgba(0,0,0,0.15); display: block; margin-left: auto; margin-right: auto; }
    h1 { font-size: 24px; font-weight: 800; font-style: italic; margin-bottom: 6px; letter-spacing: -0.5px; color: #000; text-align: center; }
    .tagline { font-size: 15px; color: #000; text-align: center; margin-bottom: 32px; line-height: 1.5; max-width: 400px; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 2px;
      color: #454545;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
      background:
        linear-gradient(#FFF, #FFF) padding-box,
        linear-gradient(90deg, var(--gc1, rgba(0,0,0,0.9)), var(--gc2, rgba(0,0,0,0.9)), var(--gc3, rgba(0,0,0,0.9)), var(--gc1, rgba(0,0,0,0.9))) border-box;
      background-size: 100% 100%, 300% 100%;
      border: 2px solid transparent;
      animation: gradient-slide 4s linear infinite;
    }
    @keyframes gradient-slide {
      0% { background-position: 0 0, 0% 0; }
      100% { background-position: 0 0, 100% 0; }
    }
    .link-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      background:
        linear-gradient(#FFF, #FFF) padding-box,
        linear-gradient(90deg, var(--gc1, rgba(0,0,0,0.9)), var(--gc2, rgba(0,0,0,0.9)), var(--gc3, rgba(0,0,0,0.9)), var(--gc1, rgba(0,0,0,0.9))) border-box;
      background-size: 100% 100%, 300% 100%;
      animation: gradient-slide 2s linear infinite;
    }
    .link-card .brand-icon { width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .link-card .brand-icon img { width: 24px; height: 24px; border-radius: 4px; object-fit: contain; }
    .link-card .card-content { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; text-align: center; }
    .link-card .label { font-size: 14px; font-weight: 700; line-height: 1.3; font-style: italic; }
    .link-card .desc { font-size: 11px; color: #8F8F8F; line-height: 1.4; display: none; }
    .link-card .desc.show { display: block; }
    .link-card .arrow { font-size: 14px; color: #C8C8C8; flex-shrink: 0; transition: all 0.2s ease; }
    .link-card:hover .arrow { transform: translateX(3px); color: #000; }
    @keyframes neon-pulse { 0% { background: linear-gradient(#FFF, #FFF) padding-box, linear-gradient(90deg, var(--gc1, rgba(195,217,64,0.9)), var(--gc2, rgba(195,217,64,0.9)), var(--gc3, rgba(195,217,64,0.9)), var(--gc1, rgba(195,217,64,0.9))) border-box; background-size: 100% 100%, 300% 100%; } 100% { background: linear-gradient(#FFF, #FFF) padding-box, linear-gradient(90deg, var(--gc1, rgba(195,217,64,0.9)), var(--gc2, rgba(195,217,64,0.9)), var(--gc3, rgba(195,217,64,0.9)), var(--gc1, rgba(195,217,64,0.9))) border-box; background-size: 100% 100%, 300% 100%; } }
    .link-card.featured { border-width: 2px; animation: gradient-slide 3s linear infinite; box-shadow: 0 0 10px rgba(195,217,64,0.3); }
    .link-card.featured .label { display: inline-block; animation: text-pulse 2.2s ease-in-out infinite; }
    @keyframes text-pulse { 0%,100% { transform: scale(1); color: #000; } 30% { transform: scale(1.08); color: #567000; } 60% { transform: scale(1.02); color: #000; } }
    .link-card.featured .desc { animation: desc-pulse 2.2s ease-in-out infinite; }
    @keyframes desc-pulse { 0%,100% { opacity: 0.7; } 30% { opacity: 1; } 60% { opacity: 0.85; } }
    .link-card.featured:hover { animation: gradient-slide 1.5s linear infinite; box-shadow: 0 0 20px rgba(195,217,64,0.5); transform: scale(1.02); }
    .link-card.featured:hover .label { animation: none; transform: scale(1.08); color: #567000; }
    .link-card.featured:hover .desc { animation: none; opacity: 1; }
    .calendar-section { width: 100%; margin-bottom: 24px; }
    .calendar-section .calendar-title { font-size: 13px; font-weight: 700; font-style: italic; color: #000; margin-bottom: 10px; text-align: center; letter-spacing: 0.5px; text-transform: uppercase; }
    .calendar-embed { width: 100%; border: 1px solid #d4d4d4; border-radius: 2px; overflow: hidden; }
    .calendar-embed iframe { display: block; width: 100%; height: 280px; border: none; }
    .footer { margin-top: 44px; font-size: 11px; color: #B0B0B0; text-align: center; }
    .footer a { color: #8F8F8F; text-decoration: none; }
    .footer a:hover { color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <div id="app">
      <img src="logo.jpg" alt="OPEN Design Independente" class="avatar">
      <h1>Links OPEN Design Independente</h1>
      <p class="tagline" id="tagline">Carregando...</p>
      <div class="calendar-section">
        <div class="calendar-title">Próximos Eventos</div>
        <div class="calendar-embed">
          <iframe src="https://calendar.google.com/calendar/embed?src=e79abcb95c1b1da56e44c0f4ff81ab7455193f83d465e5877f23335a9cb98e17%40group.calendar.google.com&ctz=America%2FSao_Paulo&mode=WEEK&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showDate=0&showNav=1&bgcolor=%23ffffff&color=%23000000" frameborder="0" scrolling="no"></iframe>
        </div>
      </div>
      <div class="links" id="links-container"></div>
      <div class="footer">
        <a href="https://pedromariacultura-lgtm.github.io/open.github.io" target="_blank">OPEN Design Independente</a>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var TEXT_ICONS = { threads: '@', x: 'X' };

      var BRAND_COLORS = {
        instagram: ['rgba(225,48,108,0.9)', 'rgba(247,119,55,0.9)', 'rgba(131,58,180,0.9)'],
        tiktok:    ['rgba(0,242,234,0.9)', 'rgba(255,0,80,0.9)', 'rgba(0,242,234,0.9)'],
        youtube:   ['rgba(255,0,0,0.9)', 'rgba(40,40,40,0.9)', 'rgba(255,0,0,0.9)'],
        threads:   ['rgba(0,0,0,0.9)', 'rgba(100,100,100,0.9)', 'rgba(0,0,0,0.9)'],
        x:         ['rgba(0,0,0,0.9)', 'rgba(29,155,240,0.9)', 'rgba(0,0,0,0.9)'],
        website:   ['rgba(100,100,100,0.9)', 'rgba(0,0,0,0.9)', 'rgba(100,100,100,0.9)'],
        edital:    ['rgba(195,217,64,0.9)', 'rgba(168,191,47,0.9)', 'rgba(195,217,64,0.9)'],
        custom:    ['rgba(143,143,143,0.9)', 'rgba(200,200,200,0.9)', 'rgba(143,143,143,0.9)']
      };

      var DOMAIN_BRANDS = {
        'instagram.com': 'instagram',
        'tiktok.com': 'tiktok',
        'youtube.com': 'youtube',
        'youtu.be': 'youtube',
        'threads.net': 'threads',
        'threads.com': 'threads',
        'twitter.com': 'x',
        'x.com': 'x',
        'docs.google.com': 'edital',
        'forms.gle': 'edital',
        'opendesignindependente.com.br': 'website'
      };

      function getDomain(url) {
        if (!url) return null;
        var s = String(url);
        if (s.indexOf("forms.gle") !== -1 || s.indexOf("docs.google.com/forms") !== -1) return "docs.google.com";
        try { return new URL(url).hostname; } catch(e) { return null; }
      }

      function detectBrand(url, platform) {
        var domain = getDomain(url);
        if (domain) {
          var base = domain.replace(/^www\./, '');
          for (var d in DOMAIN_BRANDS) {
            if (base.indexOf(d) !== -1) return DOMAIN_BRANDS[d];
          }
        }
        return platform || 'custom';
      }

      function safeUrl(url) {
        if (!url) return '#';
        var trimmed = String(url).trim();
        if (/^\s*(javascript|data|vbscript):/i.test(trimmed)) return '#';
        if (trimmed === '#') return '#';
        if (!/^https?:\/\//i.test(trimmed)) trimmed = 'https://' + trimmed;
        return trimmed;
      }

      function render(data) {
        document.getElementById('tagline').textContent = data.tagline || '';
        var container = document.getElementById('links-container');
        container.innerHTML = '';
        (data.links || []).forEach(function(link) {
          var card = document.createElement('a');
          var href = safeUrl(link.url);
          card.href = href;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          var brand = detectBrand(href, link.platform);
          card.className = 'link-card ' + brand + (link.featured ? ' featured' : '');
          var colors = BRAND_COLORS[brand] || BRAND_COLORS.custom;
          card.style.setProperty('--gc1', colors[0]);
          card.style.setProperty('--gc2', colors[1]);
          card.style.setProperty('--gc3', colors[2]);

          var iconSpan = document.createElement('span');
          iconSpan.className = 'brand-icon';
          var domain = getDomain(href);
          if (domain) {
            var faviconImg = document.createElement('img');
            faviconImg.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=64';
            faviconImg.alt = '';
            faviconImg.onerror = function() {
              this.style.display = 'none';
              var fallback = document.createElement('span');
              fallback.textContent = TEXT_ICONS[link.platform] || '🔗';
              fallback.style.fontSize = '16px';
              this.parentNode.appendChild(fallback);
            };
            iconSpan.appendChild(faviconImg);
          } else {
            iconSpan.textContent = TEXT_ICONS[link.platform] || '🔗';
          }

          card.appendChild(iconSpan);
          var content = document.createElement('span');
          content.className = 'card-content';
          var label = document.createElement('span');
          label.className = 'label';
          label.textContent = link.label;
          content.appendChild(label);
          if (link.desc) {
            var desc = document.createElement('span');
            desc.className = 'desc show';
            desc.textContent = link.desc;
            content.appendChild(desc);
          }
          card.appendChild(content);
          var arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.innerHTML = '&rarr;';
          card.appendChild(arrow);
          container.appendChild(card);
        });
      }

      fetch('https://api.github.com/repos/pedromariacultura-lgtm/open.github.io/contents/data.json', {
        cache: 'no-store',
        headers: { 'Accept': 'application/vnd.github.v3+json' }
      })
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(d) { return JSON.parse(atob(d.content.replace(/\s/g, ''))); })
        .then(function(data) { render(data); })
        .catch(function() {
          fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(data) { render(data); })
            .catch(function() {
              document.getElementById('tagline').textContent = 'Erro ao carregar dados. Tente novamente.';
            });
        });
    })();
  </script>
</body>
</html>
