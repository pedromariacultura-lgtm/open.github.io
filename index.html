  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a; color: #f5f5f5;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px 60px;
    }
    .container { max-width: 680px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .avatar {
      width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      margin-bottom: 16px; box-shadow: 0 4px 30px rgba(255, 107, 53, 0.3); display: block;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.5px; }
    .tagline {
      font-size: 14px; color: #999; text-align: center; margin-bottom: 28px;
      line-height: 1.5; max-width: 400px;
    }
    .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .link-card {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 18px; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 12px; color: #f5f5f5; text-decoration: none;
      font-size: 15px; font-weight: 500; transition: all 0.2s ease;
    }
    .link-card:hover { background: #222; border-color: #444; transform: translateY(-1px); }
    .link-card:active { transform: translateY(0); background: #252525; }
    .link-card .brand-icon { width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .link-card .brand-icon svg { width: 24px; height: 24px; fill: currentColor; color: #aaa; transition: color 0.2s ease; }
    .link-card:hover .brand-icon svg { color: #fff; }
    .link-card .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; display: none; }
    .link-card .thumb.show { display: block; }
    .link-card .thumb.show ~ .brand-icon { display: none; }
    .link-card .card-content { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: center; }
    .link-card .label { font-size: 15px; font-weight: 600; line-height: 1.3; }
    .link-card .desc { font-size: 12px; color: #888; font-weight: 400; line-height: 1.4; display: none; }
    .link-card .desc.show { display: block; }
    .link-card .arrow { font-size: 14px; color: #555; flex-shrink: 0; transition: transform 0.2s ease; }
    .link-card:hover .arrow { transform: translateX(3px); }
    .link-card.instagram:hover { border-color: #e1306c; }
    .link-card.instagram:hover .brand-icon svg { color: #e1306c; }
    .link-card.tiktok:hover { border-color: #00f2ea; }
    .link-card.tiktok:hover .brand-icon svg { color: #00f2ea; }
    .link-card.youtube:hover { border-color: #ff0000; }
    .link-card.youtube:hover .brand-icon svg { color: #ff0000; }
    .link-card.threads:hover { border-color: #fff; }
    .link-card.threads:hover .brand-icon svg { color: #fff; }
    .link-card.x:hover { border-color: #fff; }
    .link-card.x:hover .brand-icon svg { color: #fff; }
    .link-card.website:hover { border-color: #ff6b35; }
    .link-card.website:hover .brand-icon svg { color: #ff6b35; }
    .link-card.edital:hover { border-color: #8e2de2; }
    .link-card.edital:hover .brand-icon svg { color: #8e2de2; }
    .footer { margin-top: 40px; font-size: 12px; color: #444; text-align: center; }
    .footer a { color: #666; text-decoration: none; }
    .footer a:hover { color: #999; }
  </style>
</head>
