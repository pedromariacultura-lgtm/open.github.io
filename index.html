  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #E0E0E0;
      color: #454545;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px 60px;
    }

    .container { max-width: 680px; width: 100%; display: flex; flex-direction: column; align-items: center; }

    .avatar {
      width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
      margin-bottom: 18px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      display: block;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      color: #000;
      text-align: center;
    }

    .tagline {
      font-size: 13px;
      color: #8F8F8F;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
      max-width: 400px;
      font-weight: 400;
    }

    .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: #FFFFFF;
      border: 1px solid #d4d4d4;
      border-radius: 2px;
      color: #454545;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background: #fff;
      border-color: #000;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
    }

    .link-card:active { transform: translateY(0); }

    .link-card .brand-icon {
      width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .link-card .brand-icon svg {
      width: 22px; height: 22px; fill: currentColor;
      color: #8F8F8F; transition: color 0.2s ease;
    }

    .link-card:hover .brand-icon svg { color: #000; }

    .link-card .thumb { width: 48px; height: 48px; border-radius: 2px; object-fit: cover; flex-shrink: 0; display: none; }
    .link-card .thumb.show { display: block; }
    .link-card .thumb.show ~ .brand-icon { display: none; }

    .link-card .card-content { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; text-align: center; }
    .link-card .label { font-size: 14px; font-weight: 700; line-height: 1.3; font-style: italic; }
    .link-card .desc { font-size: 11px; color: #8F8F8F; font-weight: 400; line-height: 1.4; font-style: normal; display: none; }
    .link-card .desc.show { display: block; }

    .link-card .arrow { font-size: 14px; color: #C8C8C8; flex-shrink: 0; transition: transform 0.2s ease, color 0.2s ease; }
    .link-card:hover .arrow { transform: translateX(3px); color: #000; }

    .link-card.instagram:hover { border-color: #e1306c; }
    .link-card.instagram:hover .brand-icon svg { color: #e1306c; }
    .link-card.tiktok:hover { border-color: #000; }
    .link-card.tiktok:hover .brand-icon svg { color: #000; }
    .link-card.youtube:hover { border-color: #ff0000; }
    .link-card.youtube:hover .brand-icon svg { color: #ff0000; }
    .link-card.threads:hover { border-color: #000; }
    .link-card.threads:hover .brand-icon svg { color: #000; }
    .link-card.x:hover { border-color: #000; }
    .link-card.x:hover .brand-icon svg { color: #000; }
    .link-card.website:hover { border-color: #000; }
    .link-card.website:hover .brand-icon svg { color: #000; }
    .link-card.edital:hover { border-color: #C3D940; }
    .link-card.edital:hover .brand-icon svg { color: #C3D940; }

    .footer { margin-top: 44px; font-size: 11px; color: #B0B0B0; text-align: center; }
    .footer a { color: #8F8F8F; text-decoration: none; }
    .footer a:hover { color: #000; }
  </style>
</head>
